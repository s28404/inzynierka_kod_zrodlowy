# CPU-first default configuration for MiniGrid R2D2 thesis runs.

variant: r2d2
env_id: MiniGrid-Empty-8x8-v0
seed: 1

total_steps: 10_000_000
warmup_steps: 50_000
train_every: 4
grad_steps: 1
batch_size: 64
replay_capacity_sequences: 40000

burn_in: 20
unroll_len: 40
n_step: 5

gamma: 0.997
lr: 0.0001
adam_eps: 0.00000001
hidden_dim: 256

target_update_interval: 2000
max_grad_norm: 10.0

epsilon_start: 1.0
epsilon_end: 0.05
epsilon_decay_steps: 1_000_000

prio_alpha: 0.6
prio_beta_start: 0.4
prio_beta_end: 1.0
prio_eta: 0.9

# Override in CLI when needed.
intrinsic_scale: null

log_interval: 2000
eval_interval: 20000
eval_episodes: 5
checkpoint_interval: 50000

num_threads: 4
save_dir: logs_thesis/minigrid

# Mission encoding for BabyAI instructions
mission_max_tokens: 24

# DEMIR-specific defaults for r2d2_demir
demir_beta1: 0.7
demir_beta2: 0.3
demir_encoder_type: idm
