variant: r2d2
env_id: BabyAI-KeyCorridorS3R1-v0  
seed: 42

total_steps: 5_000_000
warmup_steps: 50_000
train_every: 4
grad_steps: 1
batch_size: 64
replay_capacity_sequences: 60000 

burn_in: 40         
unroll_len: 80      
n_step: 5

gamma: 0.997
lr: 0.0001
adam_eps: 0.00000001
hidden_dim: 256

target_update_interval: 2000
max_grad_norm: 10.0

epsilon_start: 1.0
epsilon_end: 0.01         
epsilon_decay_steps: 2_500_000  

prio_alpha: 0.6
prio_beta_start: 0.4
prio_beta_end: 1.0
prio_eta: 0.9

intrinsic_scale: null  # BARDZO WAŻNE: Niech kod sam bierze 0.0 lub 0.1 ze słownika!

log_interval: 2000
eval_interval: 20000
eval_episodes: 10     
checkpoint_interval: 50000

num_threads: 4
save_dir: logs_thesis/minigrid
mission_max_tokens: 24  

# DEMIR (używane tylko, gdy variant to r2d2_demir)
demir_beta1: 0.7
demir_beta2: 0.3
demir_encoder_type: idm