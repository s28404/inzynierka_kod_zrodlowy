defaults:
  - experiment: base_experiment
  - algorithm: ???
  - task: ???
  - model: layers/gru
  - model@critic_model: layers/gru
  - _self_

hydra:
  searchpath:
   # Tells hydra to add the default benchmarl configuration to its path
    - pkg://benchmarl/conf

seed: 0

experiment:
  sampling_device: "cpu"
  train_device: "cuda"
  buffer_device: "cpu"

  share_policy_params: True
  prefer_continuous_actions: True
  parallel_collection: False

  gamma: 0.99
  lr: 0.001
  clip_grad_norm: True
  clip_grad_val: 5

  soft_target_update: False
  polyak_tau: 0.005
  hard_target_update_frequency: 200

  exploration_eps_init: 1.0
  exploration_eps_end: 0.05
  exploration_anneal_frames: 100_000

  max_n_iters: null
  max_n_frames: 10_050_000

  on_policy_collected_frames_per_batch: 6000
  on_policy_n_envs_per_worker: 10
  on_policy_n_minibatch_iters: 45
  on_policy_minibatch_size: 400

  # Paper-aligned eval cadence needs 2k-step batches in this framework.
  off_policy_collected_frames_per_batch: 2000
  # Analogue of PyMARL batch_size_run=4 from the SMACv2 appendix table.
  off_policy_n_envs_per_worker: 4
  off_policy_n_optimizer_steps: 100
  off_policy_train_batch_size: 128
  off_policy_memory_size: 5_000

  evaluation: True
  render: False
  evaluation_interval: 2_000
  evaluation_episodes: 20

  loggers: [csv, wandb]
  create_json: True

  save_folder: null
  restore_file: null
  checkpoint_interval: 60000
