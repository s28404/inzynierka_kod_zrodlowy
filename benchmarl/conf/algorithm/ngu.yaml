# Plik konfiguracyjny dla mechanizmu NGU

# Autor: Kajetan Frąckowiak (s28404)
# Data: 2026
# Praca inżynierska: Polsko-Japońska Akademia Technik Komputerowych

# Opis: Plik zawiera hiperparametry oraz konfiguracje dla mechanizmu NGU bazujące na artukułach https://arxiv.org/abs/2002.06038 oraz https://arxiv.org/abs/2512.01321
# gdzie pewne hiperparametry ze względu na brak informacji w artykułach zostały dobrane autorsko

defaults:
  - ngu_config
  - _self_

# Bazowe hiperparametry QMIX
mixing_embed_dim: 32
delay_value: True
loss_function: "l2"
use_intrinsic_rewards: True

# Skala nagrody wewnętrznej NGU
demir_scale: 0.0
rnd_scale: 0.0
# Autorsko dobrana skala nagrody NGU
ngu_scale: 0.1

# Architektura NGU zgodna z artykułami wyzej
ngu_embed_dim: 64
ngu_hidden_dim: 256
ngu_k: 10

# Autuorsko dobrane hiperparametry NGU
ngu_L: 5.0
ngu_epsilon: 0.001
ngu_n_episodic: 10000
ngu_lr: 0.0001
