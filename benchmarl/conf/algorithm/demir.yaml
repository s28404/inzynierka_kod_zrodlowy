# Plik konfiguracyjny dla mechanizmu DEMIR

# Autor: Kajetan Frąckowiak (s28404)
# Data: 2026
# Praca inżynierska: Polsko-Japońska Akademia Technik Komputerowych

# Opis: Plik zawiera autorskie dobranie hiperparametrów oraz konfiguracji dla mechanizmu DEMIR

defaults:
  - demir_config
  - _self_

# Bazowe hiperparametry QMIX
mixing_embed_dim: 32
delay_value: True
loss_function: "l2"

# Hiperparametry DEMIR
emb_dim_state: 64
emb_dim_action: 16
emb_dim_reward: 8
alpha: 0.5
beta1: 0.7
beta2: 0.3
k: 10
sigma: 0.5
n_efm: 10000
n_edm: 5000
demir_scale: 0.05
encoder_type: "idm"  # "idm" (IDM+decorrelation) lub "mlp" (ablacja - samo decorrelation)
rnd_scale: 0.0
ngu_scale: 0.0