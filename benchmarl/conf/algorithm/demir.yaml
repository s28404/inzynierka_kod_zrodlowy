# Autor: Kajetan Frąckowiak, s28404 (2026) — praca inżynierska
# Polsko-Japońska Akademia Technik Komputerowych, Wydział Informatyki
# Opis: Konfiguracja algorytmu DEMIR (QMIX + Decentralized Episodic Memory
#        z nagrodą wewnętrzną opartą na IDM lub MLP).
#        Plik napisany od podstaw — nie istniał w oryginalnym BenchMARL.
#
# Kluczowe parametry:
#   demir_scale  — waga nagrody wewnętrznej DEMIR (0.0 = wyłączona)
#   encoder_type — "idm" (IDM+decorrelation) | "mlp" (ablacja, samo decor.)
#   beta1, beta2 — wagi składników nagrody epizodycznej (jakość / nowość)
#   n_efm, n_edm — pojemność buforów EFM i EDM (pamięć epizodyczna)

defaults:
  - demir_config
  - _self_

# Bazowe parametry QMIX
mixing_embed_dim: 32
delay_value: True
loss_function: "l2"

# Parametry DEMIR
emb_dim_state: 64
emb_dim_action: 16
emb_dim_reward: 8
alpha: 0.5
beta1: 0.7
beta2: 0.3
k: 10
sigma: 0.1
n_efm: 10000
n_edm: 5000
demir_scale: 0.05
encoder_type: "idm"  # "idm" (IDM+decorrelation) lub "mlp" (ablacja - samo decorrelation)
rnd_scale: 0.0
ngu_scale: 0.0