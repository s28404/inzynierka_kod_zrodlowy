# Plik konfiguracyjny dla mechanizmu RND

# Autor: Kajetan Frąckowiak (s28404)
# Data: 2026
# Praca inżynierska: Polsko-Japońska Akademia Technik Komputerowych

# Opis: Plik zawiera hiperparametry oraz konfiguracje dla mechanizmu RND bazujące na artukułach https://arxiv.org/abs/1810.12894 oraz https://arxiv.org/abs/2503.13077

defaults:
  - rnd_config
  - _self_

# Bazowe hiperparametry QMIX
mixing_embed_dim: 32
delay_value: True
loss_function: "l2"
use_intrinsic_rewards: True

# Skala nagrody wewnętrznej RND
demir_scale: 0.0
ngu_scale: 0.0
rnd_scale: 0.1 # Autorsko dobrana skala nagrody RND

# Architektura RND zgodna z artykułami wyżej
rnd_embed_dim: 64
rnd_hidden_dim: 256
# Autorsko dobrany learning rate dla RND
rnd_lr: 0.0001
